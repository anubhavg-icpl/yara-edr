<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1e1b4b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
    <!-- Gradient for shield -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4f46e5;stop-opacity:1" />
    </linearGradient>
    <!-- Gradient for accent -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#22d3ee;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
    <!-- Glow effect -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Text glow -->
    <filter id="textGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Grid pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.5" opacity="0.3"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="200" fill="url(#bgGrad)"/>

  <!-- Grid overlay -->
  <rect width="800" height="200" fill="url(#grid)" opacity="0.5"/>

  <!-- Decorative circles -->
  <circle cx="700" cy="50" r="100" fill="#4f46e5" opacity="0.1"/>
  <circle cx="100" cy="180" r="80" fill="#0891b2" opacity="0.1"/>
  <circle cx="600" cy="170" r="60" fill="#6366f1" opacity="0.08"/>

  <!-- Binary rain effect (decorative) -->
  <g fill="#6366f1" opacity="0.15" font-family="monospace" font-size="10">
    <text x="50" y="30">01101001</text>
    <text x="150" y="50">10110010</text>
    <text x="650" y="40">01001101</text>
    <text x="720" y="70">11010110</text>
    <text x="580" y="180">10101010</text>
    <text x="80" y="170">01110011</text>
  </g>

  <!-- Main content group - centered -->
  <g transform="translate(200, 40)">
    <!-- Shield icon -->
    <g transform="translate(0, 0)">
      <!-- Shield shape -->
      <path d="M60 5 L110 25 L110 70 C110 100 60 120 60 120 C60 120 10 100 10 70 L10 25 Z"
            fill="url(#shieldGrad)" stroke="#818cf8" stroke-width="2"/>

      <!-- Inner shield highlight -->
      <path d="M60 15 L100 32 L100 67 C100 92 60 108 60 108 C60 108 20 92 20 67 L20 32 Z"
            fill="none" stroke="#a5b4fc" stroke-width="1" opacity="0.4"/>

      <!-- Scanning radar element -->
      <g transform="translate(60, 60)" filter="url(#glow)">
        <!-- Outer ring -->
        <circle cx="0" cy="0" r="28" fill="none" stroke="url(#accentGrad)" stroke-width="3" opacity="0.9"/>
        <!-- Middle ring -->
        <circle cx="0" cy="0" r="18" fill="none" stroke="#22d3ee" stroke-width="2" opacity="0.6"/>
        <!-- Inner ring -->
        <circle cx="0" cy="0" r="8" fill="none" stroke="#22d3ee" stroke-width="1.5" opacity="0.4"/>
        <!-- Center dot -->
        <circle cx="0" cy="0" r="4" fill="#22d3ee"/>
        <!-- Scan line -->
        <line x1="0" y1="0" x2="25" y2="-10" stroke="#22d3ee" stroke-width="2.5" stroke-linecap="round"/>
        <!-- Secondary scan lines -->
        <line x1="0" y1="0" x2="18" y2="15" stroke="#22d3ee" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
      </g>

      <!-- Binary decoration on shield -->
      <g fill="#c7d2fe" opacity="0.25" font-family="monospace" font-size="8">
        <text x="25" y="35">01</text>
        <text x="85" y="35">10</text>
        <text x="30" y="95">1</text>
        <text x="85" y="95">0</text>
      </g>
    </g>

    <!-- Text content -->
    <g transform="translate(130, 0)">
      <!-- YARA-EDR text -->
      <text x="0" y="65" font-family="'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif"
            font-size="56" font-weight="700" fill="#f8fafc" letter-spacing="-1" filter="url(#textGlow)">
        YARA
      </text>
      <text x="155" y="65" font-family="'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif"
            font-size="56" font-weight="300" fill="#64748b">
        -
      </text>
      <text x="178" y="65" font-family="'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif"
            font-size="56" font-weight="700" fill="url(#accentGrad)" letter-spacing="-1" filter="url(#textGlow)">
        EDR
      </text>

      <!-- Tagline -->
      <text x="0" y="95" font-family="'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif"
            font-size="16" fill="#94a3b8" letter-spacing="1">
        Linux Endpoint Detection &amp; Response
      </text>

      <!-- Badges row - mathematically aligned -->
      <g transform="translate(0, 108)">
        <!--
          Badge dimensions:
          - Height: 20px
          - Border radius: 4px
          - Padding: 6px horizontal
          - Font: 11px monospace
          - Text baseline: y = 14 (20/2 + 11/3 ≈ 10 + 3.7)
        -->

        <!-- Rust badge: "rust" (28px) + "safe" (32px) = 60px total -->
        <g>
          <!-- Left section: colored background -->
          <rect x="0" y="0" width="30" height="20" rx="4" ry="4" fill="#4f46e5"/>
          <rect x="26" y="0" width="4" height="20" fill="#4f46e5"/>
          <!-- Right section: dark background -->
          <rect x="30" y="0" width="30" height="20" rx="4" ry="4" fill="#1e293b"/>
          <rect x="30" y="0" width="4" height="20" fill="#1e293b"/>
          <!-- Border -->
          <rect x="0" y="0" width="60" height="20" rx="4" ry="4" fill="none" stroke="#334155" stroke-width="1"/>
          <!-- Text - centered in each section -->
          <text x="15" y="14" font-family="monospace" font-size="11" fill="#ffffff" font-weight="600" text-anchor="middle">rust</text>
          <text x="45" y="14" font-family="monospace" font-size="11" fill="#94a3b8" font-weight="500" text-anchor="middle">safe</text>
        </g>

        <!-- Rules badge: "1600+" (40px) + "rules" (38px) = 78px total -->
        <g transform="translate(68, 0)">
          <!-- Left section: colored background -->
          <rect x="0" y="0" width="40" height="20" rx="4" ry="4" fill="#059669"/>
          <rect x="36" y="0" width="4" height="20" fill="#059669"/>
          <!-- Right section: dark background -->
          <rect x="40" y="0" width="38" height="20" rx="4" ry="4" fill="#1e293b"/>
          <rect x="40" y="0" width="4" height="20" fill="#1e293b"/>
          <!-- Border -->
          <rect x="0" y="0" width="78" height="20" rx="4" ry="4" fill="none" stroke="#334155" stroke-width="1"/>
          <!-- Text - centered in each section -->
          <text x="20" y="14" font-family="monospace" font-size="11" fill="#ffffff" font-weight="600" text-anchor="middle">1600+</text>
          <text x="59" y="14" font-family="monospace" font-size="11" fill="#94a3b8" font-weight="500" text-anchor="middle">rules</text>
        </g>

        <!-- Linux badge: "linux" (36px) + "os" (24px) = 60px total -->
        <g transform="translate(154, 0)">
          <!-- Left section: colored background -->
          <rect x="0" y="0" width="36" height="20" rx="4" ry="4" fill="#ea580c"/>
          <rect x="32" y="0" width="4" height="20" fill="#ea580c"/>
          <!-- Right section: dark background -->
          <rect x="36" y="0" width="24" height="20" rx="4" ry="4" fill="#1e293b"/>
          <rect x="36" y="0" width="4" height="20" fill="#1e293b"/>
          <!-- Border -->
          <rect x="0" y="0" width="60" height="20" rx="4" ry="4" fill="none" stroke="#334155" stroke-width="1"/>
          <!-- Text - centered in each section -->
          <text x="18" y="14" font-family="monospace" font-size="11" fill="#ffffff" font-weight="600" text-anchor="middle">linux</text>
          <text x="48" y="14" font-family="monospace" font-size="11" fill="#94a3b8" font-weight="500" text-anchor="middle">os</text>
        </g>
      </g>
    </g>
  </g>
</svg>
