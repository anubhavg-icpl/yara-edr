<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120">
  <defs>
    <!-- Gradient for shield -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4f46e5;stop-opacity:1" />
    </linearGradient>
    <!-- Gradient for accent -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0891b2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0e7490;stop-opacity:1" />
    </linearGradient>
    <!-- Glow effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Drop shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Shield icon -->
  <g transform="translate(15, 10)" filter="url(#shadow)">
    <!-- Shield shape -->
    <path d="M50 5 L90 20 L90 55 C90 80 50 95 50 95 C50 95 10 80 10 55 L10 20 Z"
          fill="url(#shieldGrad)" stroke="#818cf8" stroke-width="2"/>

    <!-- Inner shield highlight -->
    <path d="M50 12 L82 24 L82 53 C82 73 50 86 50 86 C50 86 18 73 18 53 L18 24 Z"
          fill="none" stroke="#a5b4fc" stroke-width="1" opacity="0.5"/>

    <!-- Scanning eye / radar element -->
    <g transform="translate(50, 48)" filter="url(#glow)">
      <!-- Outer ring -->
      <circle cx="0" cy="0" r="22" fill="none" stroke="url(#accentGrad)" stroke-width="2.5" opacity="0.9"/>
      <!-- Middle ring -->
      <circle cx="0" cy="0" r="14" fill="none" stroke="#0891b2" stroke-width="2" opacity="0.7"/>
      <!-- Inner ring -->
      <circle cx="0" cy="0" r="6" fill="none" stroke="#0891b2" stroke-width="1.5" opacity="0.5"/>
      <!-- Center dot -->
      <circle cx="0" cy="0" r="3" fill="#0891b2"/>
      <!-- Scan line -->
      <line x1="0" y1="0" x2="20" y2="-8" stroke="#0891b2" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
    </g>

    <!-- Binary pattern decoration -->
    <g fill="#a5b4fc" opacity="0.3" font-family="monospace" font-size="6">
      <text x="20" y="28">01</text>
      <text x="70" y="28">10</text>
      <text x="25" y="75">1</text>
      <text x="72" y="75">0</text>
    </g>
  </g>

  <!-- Text: YARA -->
  <g transform="translate(115, 0)">
    <text x="0" y="58" font-family="'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif"
          font-size="48" font-weight="700" fill="#1e293b" letter-spacing="-1">
      YARA
    </text>
    <!-- Hyphen -->
    <text x="132" y="58" font-family="'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif"
          font-size="48" font-weight="300" fill="#94a3b8">
      -
    </text>
    <!-- EDR with accent color -->
    <text x="152" y="58" font-family="'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif"
          font-size="48" font-weight="700" fill="url(#accentGrad)" letter-spacing="-1">
      EDR
    </text>
  </g>

  <!-- Tagline -->
  <text x="115" y="82" font-family="'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif"
        font-size="14" fill="#64748b" letter-spacing="0.5">
    Linux Endpoint Detection &amp; Response
  </text>

  <!-- Version badge -->
  <g transform="translate(115, 92)">
    <rect x="0" y="0" width="55" height="18" rx="9" fill="#e2e8f0"/>
    <rect x="0" y="0" width="25" height="18" rx="9" fill="#4f46e5"/>
    <path d="M25 0 L25 18 L16 18 L16 0 Z" fill="#4f46e5"/>
    <text x="7" y="13" font-family="monospace" font-size="10" fill="#fff" font-weight="600">rust</text>
    <text x="32" y="13" font-family="monospace" font-size="10" fill="#475569">safe</text>
  </g>

  <!-- Performance badge -->
  <g transform="translate(178, 92)">
    <rect x="0" y="0" width="72" height="18" rx="9" fill="#e2e8f0"/>
    <rect x="0" y="0" width="38" height="18" rx="9" fill="#059669"/>
    <path d="M38 0 L38 18 L29 18 L29 0 Z" fill="#059669"/>
    <text x="6" y="13" font-family="monospace" font-size="10" fill="#fff" font-weight="600">1600+</text>
    <text x="44" y="13" font-family="monospace" font-size="10" fill="#475569">rules</text>
  </g>
</svg>
