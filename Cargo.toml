[package]
name = "yara-edr"
version = "0.1.0"
edition = "2024"
authors = ["Anubhav Gain <anubhavg@infopercept.com>"]
description = "A YARA-powered Endpoint Detection and Response agent for Linux"
license = "MIT"
keywords = ["security", "edr", "yara", "malware", "detection"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
# YARA bindings
yara = "0.31.0"

# Async runtime
tokio = { version = "1", features = ["full", "tracing"] }

# CLI parsing
clap = { version = "4", features = ["derive", "env"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9.8"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
tracing-appender = "0.2"

# File system monitoring (Linux inotify)
inotify = "0.11.0"
notify = "8.2.0"

# Linux /proc filesystem
procfs = "0.18.0"

# Unix/Linux system calls
nix = { version = "0.30.1", features = ["signal", "process", "user", "fs"] }
libc = "0.2"

# Directory traversal
walkdir = "2"

# Hashing
sha2 = "0.10"
md-5 = "0.10"
hex = "0.4"

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Error handling
thiserror = "2.0.17"
anyhow = "1"

# Daemon support
daemonize = "0.5"

# Signal handling
ctrlc = "3"

# Concurrency
crossbeam-channel = "0.5"
parking_lot = "0.12"

# Pattern matching
glob = "0.3"
regex = "1"

# UUID for unique IDs
uuid = { version = "1", features = ["v4", "serde"] }

# Byte utilities
bytes = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[[bin]]
name = "yara-edr"
path = "src/main.rs"

# Lint configuration
[lints.rust]
unsafe_code = "warn"
# missing_docs = "warn"  # Disabled until comprehensive docs are added

[lints.clippy]
# Correctness - must fix
correctness = { level = "deny", priority = -1 }

# Suspicious code patterns
suspicious = { level = "warn", priority = -1 }

# Complexity warnings
complexity = { level = "warn", priority = -1 }

# Performance suggestions
perf = { level = "warn", priority = -1 }

# Style consistency
style = { level = "warn", priority = -1 }

# Pedantic lints (selective)
pedantic = { level = "warn", priority = -1 }
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"

# Allow common patterns in this codebase
similar_names = "allow"                 # uid/gid, etc. are intentionally similar
struct_excessive_bools = "allow"        # config structs have multiple bool flags
cast_possible_truncation = "allow"      # controlled casts in low-level code
cast_sign_loss = "allow"                # pid/uid casts are safe on Linux
cast_precision_loss = "allow"           # duration casts are acceptable
unnecessary_wraps = "allow"             # Result returns for consistency
clone_on_ref_ptr = "allow"              # .clone() on Arc is idiomatic
only_used_in_recursion = "allow"        # recursive methods using &self
trivially_copy_pass_by_ref = "allow"    # keep API consistency
return_self_not_must_use = "allow"      # builder patterns
format_push_string = "allow"            # readability over micro-optimization
unused_self = "allow"                   # keeps API consistent for methods
items_after_statements = "allow"        # local modules are fine
bool_to_int_with_if = "allow"           # explicit is clearer
unnecessary_debug_formatting = "allow"  # Debug for paths in errors is fine
match_same_arms = "allow"               # explicit match arms for future changes
field_reassign_with_default = "allow"   # struct builder pattern
unused_async = "allow"                  # async for API consistency
assigning_clones = "allow"              # clone readability

# Security-focused lints
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
dbg_macro = "warn"
todo = "warn"
