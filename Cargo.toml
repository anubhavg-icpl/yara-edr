[package]
name = "yara-edr"
version = "0.1.0"
edition = "2021"
authors = ["Anubhav"]
description = "A YARA-powered Endpoint Detection and Response agent for Linux"
license = "MIT"
keywords = ["security", "edr", "yara", "malware", "detection"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
# YARA bindings
yara = "0.28"

# Async runtime
tokio = { version = "1", features = ["full", "tracing"] }

# CLI parsing
clap = { version = "4", features = ["derive", "env"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
tracing-appender = "0.2"

# File system monitoring (Linux inotify)
inotify = "0.10"
notify = "6"

# Linux /proc filesystem
procfs = "0.16"

# Unix/Linux system calls
nix = { version = "0.29", features = ["signal", "process", "user", "fs"] }
libc = "0.2"

# Directory traversal
walkdir = "2"

# Hashing
sha2 = "0.10"
md-5 = "0.10"
hex = "0.4"

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Error handling
thiserror = "1"
anyhow = "1"

# Daemon support
daemonize = "0.5"

# Signal handling
ctrlc = "3"

# Concurrency
crossbeam-channel = "0.5"
parking_lot = "0.12"

# Pattern matching
glob = "0.3"
regex = "1"

# UUID for unique IDs
uuid = { version = "1", features = ["v4", "serde"] }

# Byte utilities
bytes = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[[bin]]
name = "yara-edr"
path = "src/main.rs"
